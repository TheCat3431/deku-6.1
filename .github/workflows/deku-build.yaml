name: PROJECT DEKU IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Verify files
        run: |
          ls -la
          test -f project.yml
          test -d Sources

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Compile PROJECT DEKU
        run: |
          xcodebuild \
            -project ProjectDeku.xcodeproj \
            -scheme ProjectDeku \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ProjectDeku.app Payload/
          zip -qry ProjectDeku.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PROJECT-DEKU-IPA
          path: ProjectDeku.ipa
